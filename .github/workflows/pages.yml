# Выкладка на GitHub Pages: ВСЕ ветки сразу, каждая своей папкой (сборка — tools/build-pages.sh).
# Запускается: пуш в main, удаление ветки, пуш в любую другую ветку (через branch-push.yml), вручную.
# Всегда работает от main: так GitHub разрешает выкладку (окружение github-pages пускает только main).
name: Выкладка всех версий
on:
  push:
    branches: [main]
  delete:
  workflow_dispatch:
  workflow_run:
    workflows: ["Ветка обновилась"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: bash tools/build-pages.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
